name: Verify Fast Sales Payment Boundary

on:
  pull_request:
    branches:
      - worktree
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  verify-and-publish-clean-branch:
    if: github.event.pull_request.head.ref == 'payment-financial-trust-boundary'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, mbstring
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply hash-guarded source transformation
        run: python3 tools/apply_fast_sales_payment_boundary.py

      - name: Verify changed-file boundary
        shell: bash
        run: |
          git add -N app/Modules/Sales/Tests/FastSalesPaymentBoundaryTest.php
          git add -N docs/changes/2026-06-29-fast-sales-payment-lifecycle.md
          cat > /tmp/expected-files <<'EOF'
          app/Modules/Sales/Http/Requests/FastSalesRequest.php
          app/Modules/Sales/Services/FastSalesService.php
          app/Modules/Sales/Tests/FastSalesPaymentBoundaryTest.php
          docs/changes/2026-06-29-fast-sales-payment-lifecycle.md
          resources/js/modules/sales/pages/FastSalesPage.tsx
          resources/js/modules/sales/salesTypes.ts
          EOF
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check

      - name: Verify PHP boundary
        run: |
          php -l app/Modules/Sales/Services/FastSalesService.php
          php -l app/Modules/Sales/Http/Requests/FastSalesRequest.php
          php -l app/Modules/Sales/Tests/FastSalesPaymentBoundaryTest.php
          grep -q 'paymentDocuments->submit' app/Modules/Sales/Services/FastSalesService.php
          grep -q 'paymentDocuments->approve' app/Modules/Sales/Services/FastSalesService.php
          grep -q 'paymentPostings' app/Modules/Sales/Services/FastSalesService.php
          ! grep -R -E 'destination_account_id|payment_accounts|requires_bank_account|postPaymentFinance|PaymentStatus' \
            app/Modules/Sales/Services/FastSalesService.php \
            resources/js/modules/sales/pages/FastSalesPage.tsx \
            resources/js/modules/sales/salesTypes.ts

      - name: Install PHP test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Run focused PHP regression test
        run: vendor/bin/phpunit app/Modules/Sales/Tests/FastSalesPaymentBoundaryTest.php

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Verify frontend contract
        run: |
          npm run typecheck
          npx eslint resources/js/modules/sales/pages/FastSalesPage.tsx resources/js/modules/sales/salesTypes.ts

      - name: Publish clean verified branch
        shell: bash
        run: |
          git diff --binary -- \
            app/Modules/Sales/Http/Requests/FastSalesRequest.php \
            app/Modules/Sales/Services/FastSalesService.php \
            app/Modules/Sales/Tests/FastSalesPaymentBoundaryTest.php \
            docs/changes/2026-06-29-fast-sales-payment-lifecycle.md \
            resources/js/modules/sales/pages/FastSalesPage.tsx \
            resources/js/modules/sales/salesTypes.ts \
            > /tmp/fast-sales-payment-boundary.patch

          git reset --hard HEAD
          git clean -fd
          git fetch origin backup/payment-financial-trust-boundary-437b513
          git checkout -B payment-financial-trust-boundary-integrated \
            origin/backup/payment-financial-trust-boundary-437b513
          git apply --index /tmp/fast-sales-payment-boundary.patch

          git config user.name 'AutoERP Architecture Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(sales): route fast sales receipts through payment lifecycle'
          git push origin HEAD:payment-financial-trust-boundary-integrated
