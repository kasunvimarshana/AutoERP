name: Vehicle Rental Integrity

on:
  pull_request:
    branches:
      - worktree-0.0.8
    paths:
      - "app/Modules/Invoice/**"
      - "app/Modules/Vehicle/**"
      - "app/Modules/VehicleRental/**"
      - "app/Modules/VehicleService/**"
      - "config/vehicle_rental.php"
      - "resources/js/modules/vehicle-rental/**"
      - "tests/Feature/VehicleRental/**"
      - "tests/Feature/VehicleService/**"
      - "tests/Unit/VehicleRental/**"
      - ".github/workflows/vehicle-rental-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vehicle-rental-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: Backend SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run backend test suite on SQLite
        run: composer test

  backend-mysql:
    name: Backend MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: autoerp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: autoerp_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run backend test suite on MySQL
        run: composer test:mysql

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
